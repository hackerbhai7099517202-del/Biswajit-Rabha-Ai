<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biswa AI - Cheats Bot Final</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-main-container">
    <div class="chat-header">
        <div class="bot-profile">
            <div class="bot-logo">B</div>
            <div>
                <h5 class="m-0 fw-bold text-white">Biswa AI</h5>
                <small class="text-muted"><span class="bot-status-dot"></span>Active</small>
            </div>
        </div>
        <div>
            <i class="fa-solid fa-code text-muted fs-4"></i>
        </div>
    </div>

    <div class="chat-body" id="chatWindow">
        <div class="message bot-message">
            Namaste! Main hoon <b>Biswa AI - The Cheats Bot</b>. Aap aaj kya trick sikhna chahte hain?
        </div>
    </div>

    <div class="chat-input-area">
        <div class="custom-input-group">
            <input type="text" id="userInputField" class="chat-input-field" placeholder="Apna sawaal poochhein (e.g., 'Python coding cheat sheet')..." autocomplete="off">
            <button class="send-btn-final" id="finalSendBtn">
                Send <i class="fa-solid fa-paper-plane ms-1"></i>
            </button>
        </div>
    </div>

    <div class="dev-footer">
        <div class="dev-credit">Developed by <strong>Biswa Dev Team</strong></div>
        <div class="copyright-text">© 2023 Biswa AI. All Rights Reserved.</div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
